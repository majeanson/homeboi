<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF3E4" />
    <meta name="description" content="Babillard — un planificateur familial calme pour une tablette murale." />
    <title>Babillard</title>
    <!-- PWA: installable on the wall tablet / iPad (Partager ▸ Sur l'écran
         d'accueil) — standalone chrome, fridge-magnet icon, offline app shell
         via /sw.js (registered in src/lib/registerSw.ts, prod builds only). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Babillard" />
    <!-- Pip design system type: Baloo 2 (chunky, friendly, rounded headlines),
         Hanken Grotesk (humanist body), Caveat (handwritten accents — toddler
         delight). display=swap so a kiosk that loses wifi falls back to the
         system stack instead of blanking (NFR-OFFLINE-1). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Caveat:wght@500;600;700&display=swap"
    />
    <!-- Pip icon registry (Phosphor paths inlined as SVG, recoloured via
         currentColor). Loads before the module so window.PIP_ICONS is ready. -->
    <script src="/pip-icons.js"></script>
    <!-- Set the theme before React mounts so a reload never flashes the wrong
         surface. Day/night from localStorage, falling back to the OS setting. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
