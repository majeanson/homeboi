<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: Chrome/Android shrinks the layout viewport when the
         keyboard opens so fixed sheets stay visible; iOS ignores it (handled by
         the visualViewport → CSS-vars tracker in src/lib/viewportVars.ts).
         maximum-scale=1 + user-scalable=no: lock browser pinch / double-tap zoom.
         This is an installed kiosk/wall-tablet PWA whose own "zoom to read" is
         tap-to-fullscreen (ZoomableImg) — browser zoom only made the fixed
         full-screen overlays (cashier, cook, sheets) shimmer and re-anchor mid-
         gesture. Reinforced by touch-action in core.css + a gesturestart guard
         in viewportVars.ts (iOS Safari ignores user-scalable=no in a browser
         tab, honours it once installed standalone).

         THIS LINE IS WHY axe REPORTS `meta-viewport` ON EVERY STATE (154/154 in
         the sweep — see e2e/state-matrix.spec.ts). It is a decided trade, not an
         oversight, and it is left REPORTED rather than excluded: unlike
         `.avatar__initial` — a gap the palette genuinely cannot close — this one
         is a choice we could revisit, and a choice should keep costing a line in
         the report that a reviewer reads.

         What we owe in exchange is a real substitute, because we took the
         browser's away. That is Réglages ▸ Affichage ▸ Texte
         (lib/accessibility TextScale): 100% / 115% / 130% as of 2026-09-15.
         The third step was held for half a day on a greeting that clipped at
         360px, and the cause turned out to be ONE uncompensated child of this
         header's own button cluster rather than the ramp — see --chrome-scale in
         core.css, and lib/accessibility.ts for why the measurement mattered more
         than the fix.
         130% is still short of WCAG 1.4.4's 200%, and what stands in the way is
         the px-sized chrome, not this tag. If that ever goes rem, re-open this
         decision rather than adding a fourth step. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- FIRST PAINT ONLY. lib/theme.ts rewrites the unscoped tag from the painted
         --paper as soon as it runs, so the chrome tracks the in-app theme AND the
         ambient dusk tiers. These two media-scoped tags just avoid a cream flash on
         a phone already in dark mode, before that happens. -->
    <meta name="theme-color" content="#FBF3E4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1712" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBF3E4" />
    <meta name="description" content="Babillard — un planificateur familial calme pour une tablette murale." />
    <title>Babillard</title>
    <!-- Baseline Open Graph / Twitter card, so ANY link unfurls sensibly. A shared
         /partage/<id> link gets these REPLACED per-share at the edge (worker/index.ts
         injectShareOg) with the recipe/event/routine title + photo. -->
    <meta property="og:title" content="Babillard" />
    <meta property="og:description" content="Le babillard familial calme pour la maison." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Babillard" />
    <meta property="og:locale" content="fr_CA" />
    <meta name="twitter:card" content="summary" />
    <!-- PWA: installable on the wall tablet / iPad (Partager ▸ Sur l'écran
         d'accueil) — standalone chrome, sun icon (Pip marigold on cream, see
         scripts/make-icons.mjs), offline app shell via /sw.js (registered in
         src/lib/registerSw.ts, prod builds only). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- standalone full-screen kiosk. iOS standalone-PWA blocks webkitSpeechRecognition
         (instant "aborted") — confirmed via a minimal-ui test where voice revived. We
         keep full-screen and route iOS-standalone voice through MediaRecorder→Workers AI
         Whisper instead (getUserMedia works in the sandbox; only the recognizer is gated). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Babillard" />
    <!-- Pip design system type: Baloo 2 (chunky, friendly, rounded headlines),
         Hanken Grotesk (humanist body), Caveat (handwritten accents — toddler
         delight). display=swap so a kiosk that loses wifi falls back to the
         system stack instead of blanking (NFR-OFFLINE-1). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Caveat:wght@500;600;700&display=swap"
    />
    <!-- Set the theme before React mounts so a reload never flashes the wrong
         surface. Day/night from localStorage, falling back to the OS setting. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
