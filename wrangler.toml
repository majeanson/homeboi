# Cloudflare Worker config for Babillard.
#
# Babillard is a Worker with static assets: the built SPA (dist/) is served by
# the [assets] binding, and the Worker code in worker/index.ts handles /api/*
# (routing to the handlers under functions/api/). Deploy with `wrangler deploy`
# → https://babillard.<account>.workers.dev.
#
# Plaintext config lives here, not in the dashboard. Secrets (SESSION_SECRET,
# optional LOGIN_PASSWORD) go through `wrangler secret put` for prod and
# .dev.vars for local dev (see .dev.vars.example).

name = "babillard"
main = "worker/index.ts"
# Bumped 2024-12-30 → 2026-09-01 (the last complete month) by STATE §4-L L13. A
# compatibility date is a PIN, not a version: the runtime keeps every behaviour that
# was current on that day, so a two-year-old date means two years of fixes the Worker
# deliberately does not receive. Moving it is a real change — verified here by the
# real-runtime suite (npm run test:d1 runs the whole Worker in workerd against a real
# D1), a `wrangler deploy --dry-run`, and production after the deploy.
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# --- Custom domain -----------------------------------------------------------
# Serve the app from babillard.marcportal.com (in addition to the default
# *.workers.dev URL). `custom_domain = true` makes Cloudflare create the proxied
# DNS record + TLS cert on the marcportal.com zone at deploy time. The zone must
# live in this same Cloudflare account (it does — marc_jeanson@hotmail.com).
routes = [
  { pattern = "babillard.marcportal.com", custom_domain = true },
]
# Keep the default <name>.workers.dev URL enabled too: declaring `routes` would
# otherwise disable it, breaking any kiosk/bookmark on the old address. Both URLs
# serve the same Worker.
workers_dev = true

# --- Static assets: the built SPA --------------------------------------------
# `npm run build` writes the Vite bundle to ./dist. Unknown paths fall back to
# index.html so client-side routes (/board, /kitchen…) load; the Worker reaches
# the assets via the ASSETS binding for any non-/api/* request.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# --- D1: all household state --------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "babillard"
# database_id is filled in after `wrangler d1 create babillard`. Left blank so
# a fresh clone doesn't accidentally point at someone else's DB.
database_id = "edfe36a8-a611-4000-935a-b682d83b026b"
migrations_dir = "functions/db/migrations"

# --- Workers AI: the one AI feature (capture intent-router + weekly recap) ----
# Optional binding. With AI unset (or local dev without `wrangler login`), the
# capture bar degrades to a manual type-picker — the rest of the app is fine.
[ai]
binding = "AI"

# --- R2: family photos + member avatar images --------------------------------
# Optional binding (graceful-degrade like [ai] — with it unset the photo features
# simply hide). Create the bucket once: `wrangler r2 bucket create babillard-photos`.
# Stays free: R2's free tier is 10 GB with NO egress fees, and we resize images
# on upload + cap the home-photo count (oldest auto-pruned), so a household uses
# kilobytes-to-megabytes — never close to a bill.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "babillard-photos"

[vars]
# Public, build-time + runtime config. Nothing secret here.
APP_NAME = "Babillard"
DEFAULT_LANG = "fr"
# Who may create an account (functions/_lib/signupGate.ts). "1" = anyone, no invite
# code; anything else = the LOGIN_PASSWORD secret doubles as the invite code. Opening
# signup is THIS line, in a commit — never `wrangler secret delete LOGIN_PASSWORD`,
# which would also unlock every legacy (no-hash) account at login.
SIGNUP_OPEN = "1"

# --- Nightly backup (bmad/08 E-36) --------------------------------------------
# 07:10 UTC ≈ 2-3 AM Eastern: the Worker's `scheduled` handler dumps every
# household to R2 (backup/<householdId>/<date>.json, newest 14 kept) — cheap
# insurance against a migration bug eating the only real household. R2 unset →
# the handler no-ops (optional binding, like everything else).
[triggers]
crons = ["10 7 * * *"]

# --- Durable Objects: realtime fan-out (SCAFFOLD, #20) ------------------------
# RealtimeHub is a per-household WebSocket hub: clients connect to /api/live and
# the server pushes {type:'invalidate', keys:[...]} so an awake board refreshes
# the moment another device writes — an OPTIMIZATION over polling, which stays as
# the fallback (src/lib/query.ts). The client tolerates the socket being absent,
# so the app is unaffected if this DO is never deployed.
#
# IMPORTANT: Durable Objects require a DO-eligible Workers plan (Workers Paid, or
# the free tier with SQLite-backed DOs). The integrator MUST verify the account
# is DO-eligible BEFORE `wrangler deploy` — an ineligible account fails the deploy
# on this binding. If you're not ready to enable DOs, comment this block out and
# the /api/live route degrades to a 503 (polling continues regardless).
#
# ACTIVATED 2026-06-17: account confirmed DO-eligible (workers_scripts scope,
# SQLite-backed DO is free-tier). Client gate flipped (REALTIME_ENABLED=true in
# src/main.tsx). To roll back: re-comment both blocks below → /api/live 503s and
# polling continues unaffected.
[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

# A new SQLite-backed DO class needs a migration tag. `new_sqlite_classes` is the
# current free-tier-eligible form; switch to `new_classes` if you provision a
# key-value-backed DO on a paid plan instead.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

# --- Observability: keep the logs the code already writes ----------------------
# Every 500 already calls `console.error` with the method, the path and the error
# (`functions/_lib/route.ts` and `worker/index.ts`), and until 2026-09-14 NOTHING
# retained any of it: this Worker predates the default-on setting, so a live
# household hit an error and nobody could ever find out. Workers Logs keeps 7 days
# of them, queryable in the dashboard (Observability ▸ Query Builder).
#
# `invocation_logs` stays ON deliberately. It is the noisy half — one line per
# request, and this app POLLS (10 s while someone is using it, 300 s idle behind
# the realtime socket) — but it is also the half that carries CPU and wall time per
# invocation, which is the one signal that would have caught `/api/year` burning
# 1.8 s of a ~10 ms budget. That was found by reading code; it should not have to be.
#
# And NOT sampled, for a reason worth writing down: head sampling drops whole
# INVOCATIONS, custom logs included. Sampling to cut the poll noise would throw away
# the same fraction of the `console.error` lines — and errors here are rare and are
# the entire point. One household on a wall tablet and a phone is a few thousand
# requests a day; there is nothing to save. If this ever serves many households,
# `head_sampling_rate` below 1 is the lever — knowing it costs errors too.
[observability]
enabled = true

  [observability.logs]
  enabled = true
  invocation_logs = true
  head_sampling_rate = 1

# The brute-force bound on the unauthenticated doors (functions/_lib/rateLimit.ts,
# STATE.md §4-L L2). LIMIT_IP is the flood bound per caller address; LIMIT_KEY the
# per-target bound (an email being guessed at, a password door). Permissive and
# per-colo by design — a bound, not an accounting system. rateLimit.test.ts pins
# that both are declared here; health reports `rateLimit` so an unset one is visible.
[[ratelimits]]
name = "LIMIT_IP"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_KEY"
namespace_id = "1002"
simple = { limit = 6, period = 60 }
