name: CI & Deploy

# CI (typecheck · test · build) runs on every push and PR, and GATES the deploy.
# Deploy to the Cloudflare Worker is the same `npm run deploy` you run locally,
# gated behind green CI.
#
# E2E (Playwright) lives in its OWN workflow (e2e.yml) and is now CHAINED to run
# AFTER this workflow concludes successfully (via `workflow_run`), instead of
# racing it in parallel. So a push to main still ships the moment CI is green,
# and the slower browser suite runs once afterward for signal.

on:
  push:
    branches: ['**']
  pull_request:

# One run per ref. Cancel superseded branch/PR runs, but never cancel a deploy
# mid-flight (main runs are left to finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # C-23 (bmad/08): size budgets + the load-bearing offline check — every lazy
      # chunk must be in the sw.js precache (a kiosk rebooting offline must open
      # every lazy route), EXCEPT the online-only allowlist (the HEIC upload
      # decoder), which must NOT be. See scripts/check-bundle.mjs.
      - run: npm run check:bundle
      # Dead-code gate. It was in package.json and in the project's own notes as "the
      # gate" for months while being wired into NOTHING — so it gated nothing, and by
      # 2026-08-27 it no longer even ran on a dev machine (oxc-parser reserves a >4 GiB
      # ArrayBuffer for its raw-transfer parse, which fails on a memory-tight Windows
      # box; a CI runner has the headroom). Wired here so the claim becomes true.
      #
      # knip.json sets `ignoreExportsUsedInFile`: without it the report was ~90%
      # "this export is only used inside its own module", which is a superfluous
      # `export` keyword, not dead code — and that noise is exactly why the report
      # was being skimmed and ignored.
      - run: npm run knip

  deploy:
    name: Deploy to Cloudflare
    # Gated on CI only (typecheck · test · build). E2E runs in parallel and is
    # intentionally NOT a dependency, so deploys aren't held up by the browser
    # suite — check the E2E job separately for visual/flow regressions.
    needs: [ci]
    # Only the real branch advancing — not PRs, not feature branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Apply any new D1 migrations to prod BEFORE shipping Worker code that may
      # depend on them. wrangler skips its confirmation prompt in CI (GitHub
      # sets CI=true); a no-op when there's nothing new to apply.
      - run: npm run db:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # `npm run deploy` == build (tsc + vite) then `wrangler deploy`. Wrangler
      # reads the API token + account id from these env vars; D1/R2/AI bindings
      # and the runtime secrets (SESSION_SECRET, LOGIN_PASSWORD) already live in
      # the Cloudflare project, so they are NOT needed here.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
