name: CI & Deploy

# CI (typecheck · test · build) runs on every push and PR, and GATES the deploy.
# Deploy to the Cloudflare Worker is the same `npm run deploy` you run locally,
# gated behind green CI.
#
# E2E (Playwright) lives in its OWN workflow (e2e.yml) and is now CHAINED to run
# AFTER this workflow concludes successfully (via `workflow_run`), instead of
# racing it in parallel. So a push to main still ships the moment CI is green,
# and the slower browser suite runs once afterward for signal.

on:
  push:
    branches: ['**']
  pull_request:

# One run per ref. Cancel superseded branch/PR runs, but never cancel a deploy
# mid-flight (main runs are left to finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # C-23 (bmad/08): size budgets + the load-bearing offline check — every lazy
      # chunk must be in the sw.js precache (a kiosk rebooting offline must open
      # every lazy route), EXCEPT the online-only allowlist (the HEIC upload
      # decoder), which must NOT be. See scripts/check-bundle.mjs.
      - run: npm run check:bundle
      # The real-runtime suite (STATE.md §4-L L3): the Worker in workerd against a real
      # D1 with every migration applied — the tenant-isolation sweep, the account flows,
      # the demo sandbox + its sweep. After build because wrangler.toml's [assets] block
      # points at dist/. It found the sweep that had deleted nothing since 0102 on its
      # first run; keep it here, not decoupled.
      - run: npm run test:d1
      # Dead-code gate. It was in package.json and in the project's own notes as "the
      # gate" for months while being wired into NOTHING — so it gated nothing, and by
      # 2026-08-27 it no longer even ran on a dev machine (oxc-parser reserves a >4 GiB
      # ArrayBuffer for its raw-transfer parse, which fails on a memory-tight Windows
      # box; a CI runner has the headroom). Wired here so the claim becomes true.
      #
      # knip.json sets `ignoreExportsUsedInFile`: without it the report was ~90%
      # "this export is only used inside its own module", which is a superfluous
      # `export` keyword, not dead code — and that noise is exactly why the report
      # was being skimmed and ignored.
      - run: npm run knip

  deploy:
    name: Deploy to Cloudflare
    # Gated on CI only (typecheck · test · build). E2E runs in parallel and is
    # intentionally NOT a dependency, so deploys aren't held up by the browser
    # suite — check the E2E job separately for visual/flow regressions.
    needs: [ci]
    # Only the real branch advancing — not PRs, not feature branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Apply any new D1 migrations to prod BEFORE shipping Worker code that may
      # depend on them. wrangler skips its confirmation prompt in CI (GitHub
      # sets CI=true); a no-op when there's nothing new to apply.
      - run: npm run db:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # `npm run deploy` == build (tsc + vite) then `wrangler deploy`. Wrangler
      # reads the API token + account id from these env vars; D1/R2/AI bindings
      # and the runtime secrets (SESSION_SECRET, LOGIN_PASSWORD) already live in
      # the Cloudflare project, so they are NOT needed here.
      #
      # `tee` because the NEXT step reads the URLs wrangler just printed (see there).
      # `shell: bash` is load-bearing with that pipe: GitHub's default is `bash -e`, which
      # does NOT set pipefail, so `wrangler deploy | tee` would report the exit code of
      # `tee` and a failed deploy would read as green. Naming the shell explicitly gets
      # `bash --noprofile --norc -eo pipefail`.
      - name: Deploy
        shell: bash
        run: npm run deploy 2>&1 | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # « Regle-remarque » — close the loop on « Les remarques » (0136), and only after
      # the deploy that carries the fix is actually live. Claude Code commits a fix with a
      # `Regle-remarque: <id>` trailer (several allowed in one commit) plus an
      # « Explication: » paragraph; this POSTs that to the running app, which marks each
      # remark « expédiée » with the commit sha. The household's own tap is what CONFIRMS
      # it — CI can only ever set 'shipped' (functions/api/remarks/shipped.ts).
      #
      # Step ordering IS the "after a successful deploy" condition: if `npm run deploy`
      # fails, this never runs. No `if:` to get wrong.
      #
      # continue-on-error ON PURPOSE, and the decisive reason is not the obvious one. The
      # obvious one: the deploy has already succeeded, so a red X here would claim main is
      # broken when main is live. The decisive one: a failed step flips this workflow's
      # CONCLUSION to `failure`, and e2e.yml chains on `workflow_run` + conclusion ==
      # 'success' — so a missed remark notification would silently cancel the entire
      # Playwright suite for that commit. The step is loud on its own instead, via
      # ::warning:: annotations, which show on the run summary even under
      # continue-on-error.
      #
      # IT POSTS TO THE *.workers.dev HOST, NOT THE PUBLIC ONE — found 2026-09-22, the
      # first time a fix actually named a remark. The POST to
      # `babillard.marcportal.com` came back **HTTP 403 with a « Just a moment… »
      # interstitial**: Cloudflare's own edge challenged it before the Worker ever saw
      # it. That zone challenges a bare `fetch` from a datacenter IP, and a challenge is
      # not something a `fetch` can solve — which is also why the Playwright workflows
      # against the same host are fine (a real browser solves it) and why nothing caught
      # this until a non-browser client mattered. The secret gate was never the problem:
      # the same request answers 401 from a laptop.
      #
      # `*.workers.dev` is the SAME Worker without the zone in front (`workers_dev =
      # true` in wrangler.toml), and this call is machine-to-machine, authenticated by
      # `X-Deploy-Secret` — that header IS the boundary here, by design
      # (functions/api/remarks/shipped.ts is deliberately not `authed()`). Nothing new is
      # exposed: that hostname already serves the app.
      #
      # The URL is READ FROM THE DEPLOY rather than hard-coded, so it cannot rot when an
      # account subdomain changes — wrangler prints every URL it published and the
      # previous step tee'd them. The public host stays as the fallback: if the line ever
      # stops being printed, the loop degrades to today's behaviour instead of to nothing.
      - name: Notify the remark journal (Regle-remarque)
        continue-on-error: true
        shell: bash
        env:
          # Used only if the deploy printed no *.workers.dev URL.
          REMARKS_FALLBACK_ENDPOINT: https://babillard.marcportal.com/api/remarks/shipped
          # ≥32 chars, the SAME value as `wrangler secret put DEPLOY_NOTIFY_SECRET`.
          # Unset here → the script skips and says so; unset on the WORKER → 503 and the
          # door stays shut. Both directions fail closed.
          DEPLOY_NOTIFY_SECRET: ${{ secrets.DEPLOY_NOTIFY_SECRET }}
          # ── UNTRUSTED INPUT, PASSED AS DATA ──────────────────────────────────────
          # A commit message is text authored outside review. `${{ … }}` inside a `run:`
          # is substituted BEFORE bash parses the line, so a backtick or a `$(…)` in a
          # commit message would be shell executing on a runner that holds
          # CLOUDFLARE_API_TOKEN. In `env:` it is inert, and node reads it with
          # process.env without ever shelling out. scripts/ci-untrusted.test.mjs fails
          # the build if this ever moves into the `run:` line.
          #
          # `github.event.commits` and not just `head_commit`: a push of three commits
          # where the MIDDLE one carries the trailer would otherwise be lost for good,
          # with no signal anywhere. Each trailer is attributed to the sha of the commit
          # that carried it, not to whatever landed on top.
          PUSH_COMMITS: ${{ toJSON(github.event.commits) }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        # Only our own deploy output is parsed here — no `${{ github.event… }}` reaches
        # this block, which is the rule ci-untrusted.test.mjs holds.
        run: |
          host="$(grep -oiE 'https://[a-z0-9][a-z0-9.-]*\.workers\.dev' deploy.log | head -n1 || true)"
          export REMARKS_ENDPOINT="${host:+$host/api/remarks/shipped}"
          export REMARKS_ENDPOINT="${REMARKS_ENDPOINT:-$REMARKS_FALLBACK_ENDPOINT}"
          node scripts/notify-remarks.mjs
