name: CI & Deploy

# CI (typecheck · test · build) runs on every push and PR. Deploy to the
# Cloudflare Worker runs only after CI passes on a push to main — the same
# `npm run deploy` you run locally, just gated behind green checks.

on:
  push:
    branches: ['**']
  pull_request:

# One run per ref. Cancel superseded branch/PR runs, but never cancel a deploy
# mid-flight (main runs are left to finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only chromium is configured (playwright.config.ts); --with-deps pulls the
      # Linux system libs the browser needs on the runner.
      - run: npx playwright install --with-deps chromium
      # Playwright boots the Vite dev server itself (webServer config) and stubs
      # every /api/* call per-test — no wrangler/D1/secrets needed.
      - run: npm run e2e
      # Always upload the HTML report + the surface×theme×format PNGs so a failure
      # (or just a visual review) is inspectable from the run page.
      - name: Upload Playwright report + screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            e2e/report
            e2e/screenshots
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [ci, e2e]
    # Only the real branch advancing — not PRs, not feature branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Apply any new D1 migrations to prod BEFORE shipping Worker code that may
      # depend on them. wrangler skips its confirmation prompt in CI (GitHub
      # sets CI=true); a no-op when there's nothing new to apply.
      - run: npm run db:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # `npm run deploy` == build (tsc + vite) then `wrangler deploy`. Wrangler
      # reads the API token + account id from these env vars; D1/R2/AI bindings
      # and the runtime secrets (SESSION_SECRET, LOGIN_PASSWORD) already live in
      # the Cloudflare project, so they are NOT needed here.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
