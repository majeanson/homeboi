name: Stranger walk

# The weekly walk through the DEPLOYED app as a first-time visitor
# (e2e/stranger-live.spec.ts under e2e/stranger.config.ts). No Vite, no stubs, no
# account: it opens the marketing door, mints a demo sandbox, walks every tab, writes
# once, and reaches the claim form — on a laptop and on an iPhone profile.
#
# Deliberately NOT chained to pushes: it drives production, and a network-bound run has
# no place gating a deploy. The scripted version of this walk found four defects in one
# afternoon (STATE §4-K wave 1) and lived in a session scratchpad, which is where
# findings go to be lost.
#
# A red run is never "fix the test": it means a stranger's first five minutes broke.
# Read WHICH step failed — the step names are the whole signal — and the attached
# timings + screenshot.
#
# Each run mints one 24 h sandbox; the nightly cron sweeps it (functions/_lib/nightly.ts).

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Deployment to walk (default: production)'
        required: false
        type: string
  schedule:
    # Mondays 07:30 UTC — after the State matrix (07:00) and the Flipp contract, same
    # review morning.
    - cron: '30 7 * * 1'

concurrency:
  group: stranger-walk-${{ github.sha }}
  cancel-in-progress: true

jobs:
  walk:
    name: The stranger's walk (Playwright, live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # BOTH engines. The iPhone profile is WebKit, and this step installed chromium
      # only — so the phone half of the walk has never once run in CI: every scheduled
      # run reported « Executable doesn't exist at …/webkit-2287/pw_run.sh » among its
      # failures, which read as part of the red rather than as the guard being absent.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e:stranger
        env:
          # THE *.workers.dev HOST, for the same reason the remark callback uses it
          # (2026-09-22): this zone's bot protection challenges datacenter traffic, and
          # a challenge is not something a scripted visitor can solve. The walk’s demo
          # mint came back « La démo n’est pas disponible » from the runner while the
          # identical walk passed that step from a laptop — so the weekly run was
          # failing on Cloudflare, not on the app, which is the worst kind of red: one
          # that looks like a finding.
          #
          # WHAT THIS COSTS, said plainly: the zone’s WAF and its edge caching are no
          # longer exercised. The security HEADERS still are (emitted by the Worker and
          # by dist/_headers, both hostname-independent), and so is every byte of the
          # app. A dispatch can still aim at the public hostname with the `url` input —
          # worth doing by hand from a laptop when the door itself is the question.
          BABILLARD_URL: ${{ inputs.url || 'https://babillard.marc-jeanson.workers.dev' }}
      - name: Upload what the stranger saw
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: stranger-walk
          path: e2e/test-results-stranger
          retention-days: 14
